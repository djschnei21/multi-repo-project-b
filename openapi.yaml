openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: >
    Contract between todo-api (this repo, multi-repo-project-b) and todo-web
    (multi-repo-project-a). This file is the source of truth for both repos.
servers:
  - url: http://localhost:4000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/todos:
    get:
      summary: List todos
      responses:
        '200':
          description: All todos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Todo' }
    post:
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTodo' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      summary: Update a todo's title, done flag or tags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a todo
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    Todo:
      type: object
      required: [id, title, done, createdAt]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Buy milk }
        done: { type: boolean, example: false }
        tags: { $ref: '#/components/schemas/Tags' }
        createdAt: { type: string, format: date-time }
    NewTodo:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        tags: { $ref: '#/components/schemas/Tags' }
    TodoUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        done: { type: boolean }
        tags: { $ref: '#/components/schemas/Tags' }
    Tags:
      type: array
      description: >
        Optional labels. The server trims and lowercases each tag, drops empty
        ones and removes duplicates. Todos without tags return an empty array.
      items: { type: string }
      example: [work, urgent]
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No todo with that id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
